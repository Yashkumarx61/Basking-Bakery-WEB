name: Build & Test CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Node.js CI (Build Verification)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_ADMIN_USER: ${{ secrets.VITE_ADMIN_USER || 'AdminBakery' }}
          VITE_ADMIN_PASS: ${{ secrets.VITE_ADMIN_PASS || 'B@kery061111' }}
          VITE_WHATSAPP_NUMBER: '919311267246'
        run: npm run build
