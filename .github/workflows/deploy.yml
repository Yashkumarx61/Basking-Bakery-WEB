name: Deploy Static Site & Container

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  deploy-s3:
    name: Deploy Static Assets to AWS S3 & CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static assets
        env:
          VITE_ADMIN_USER: ${{ secrets.VITE_ADMIN_USER || 'AdminBakery' }}
          VITE_ADMIN_PASS: ${{ secrets.VITE_ADMIN_PASS || 'B@kery061111' }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER || '919311267246' }}
          VITE_SHEET_API_URL: ${{ secrets.VITE_SHEET_API_URL || '' }}
        run: npm run build

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Deploy to S3 Bucket
        if: ${{ secrets.AWS_S3_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete --cache-control "max-age=31536000, public"

      - name: Invalidate CloudFront Cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

